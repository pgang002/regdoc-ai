[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regdoc-ai"
version = "0.1.0"
description = "Regulatory document OCR, table extraction, validation, and redaction pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pypdf>=3.17,<4",
  "pytesseract>=0.3.13,<0.4",
  "opencv-python-headless>=4.10,<5",
  "requests>=2.32,<3",
  "Pillow>=10,<13",
  "pdfplumber>=0.11,<1",
  "camelot-py>=1,<2",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "scikit-image>=0.24,<1",
  "joblib>=1.4,<2",
  "spacy>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
app = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "streamlit>=1.49,<2",
  "prometheus-client>=0.21,<1",
]
infra = [
  "SQLAlchemy>=2.0.46,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.6,<6",
  "redis>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
