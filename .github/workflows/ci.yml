name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ghostscript libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-infra.txt
          python -m pip install -e ".[dev,app,infra]"
      - name: Static checks
        run: |
          python -m compileall -q api app src scripts
          ruff check api app src tests
      - name: Test suite
        env:
          REGDOC_QUEUE_MODE: eager
          REGDOC_DATABASE_URL: sqlite:///runtime/ci/regdoc.db
          REGDOC_WORKSPACE: runtime/ci/documents
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: regdoc-ai:ci
